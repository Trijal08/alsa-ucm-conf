# On-board stereo speakers and the built-in microphones, both behind the
# AOC.  The route to the CS35L41 amplifiers is powered automatically by the
# codec's DAPM, so the devices only need to name their PCMs -- except for the
# speaker-protection DSP, which has to be booted and routed explicitly.

SectionVerb {
	# Nothing outside the VoiceCall verb should be holding a call's route
	# up.  Put its switch down here rather than trust it to be down: it is
	# an ordinary mixer control, so a stored state can bring it back at
	# boot, and it would sit the amplifiers on the modem's downlink.
	EnableSequence [
		cset "name='Call Downlink Switch' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "On-board stereo speakers"

	# Mutually exclusive with Earpiece below.  The pair has to be declared
	# both ways round: a device with no exclusivity relationship becomes a
	# sink of its own with no ports at all, and a set of exclusive ones
	# becomes a single sink carrying a port each.
	ConflictingDevice [
		"Earpiece"
	]

	# Route the speakers through the CS35L41's Halo DSP, which runs Cirrus'
	# speaker-protection firmware: it models driver excursion and voice-coil
	# temperature and limits before either exceeds what the driver survives.
	# Out of reset the amplifier takes the ASP straight to the output stage,
	# which plays fine but enforces no such limit, so the speakers can be
	# driven past their mechanical range on loud low-frequency content.
	#
	# The order matters: the sources feed DSP1, the preload switch boots it
	# (loading cirrus/cs35l41-dsp1-spk-prot-<board>[-r].{wmfw,bin}), and only
	# then does the output mux take its input from the DSP rather than the ASP.
	#
	# Values follow the stock mixer_paths.xml: analog gain 17 rather than the
	# 20 the bypass path needed, since the protection tuning supplies the rest
	# of the gain structure and it is what the tuning was voiced against.
	EnableSequence [
		cset "name='DSP RX1 Source' ASPRX1"
		cset "name='DSP RX2 Source' ASPRX1"
		cset "name='R DSP RX1 Source' ASPRX1"
		cset "name='R DSP RX2 Source' ASPRX1"

		cset "name='DSP1 Firmware' Protection"
		cset "name='R DSP1 Firmware' Protection"

		cset "name='DSP1 Preload Switch' 1"
		cset "name='R DSP1 Preload Switch' 1"

		cset "name='PCM Source' DSP"
		cset "name='R PCM Source' DSP"

		cset "name='Analog PCM Volume' 17"
		cset "name='R Analog PCM Volume' 17"
	]

	# Hand the amplifiers back to the unprotected bypass on the way out, so a
	# card left disabled does not sit with a half-configured DSP in its path.
	DisableSequence [
		cset "name='PCM Source' ASP"
		cset "name='R PCM Source' ASP"
		cset "name='DSP1 Preload Switch' 0"
		cset "name='R DSP1 Preload Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

# The same top speaker as the Voice Call verb's Earpiece, offered here so
# media can be played near-field as well -- and so this verb has two
# mutually exclusive outputs.  With only one it had none, which is not a
# problem for ALSA or PipeWire but is one for a call daemon: callaudiod reads
# every sink's active_port->name without checking it for NULL, and a sink
# with no ports has no active port, so it faulted on this card at startup
# and never routed anything.
SectionDevice."Earpiece" {
	Comment "Earpiece (top speaker, near-field)"

	ConflictingDevice [
		"Speaker"
	]

	# Speaker's DisableSequence hands the amplifiers back to the unprotected
	# bypass, so selecting this route has to boot the protection DSP again.
	# Every cset is idempotent, exactly as in the Voice Call verb.
	EnableSequence [
		cset "name='DSP RX1 Source' ASPRX1"
		cset "name='DSP RX2 Source' ASPRX1"
		cset "name='R DSP RX1 Source' ASPRX1"
		cset "name='R DSP RX2 Source' ASPRX1"

		cset "name='DSP1 Firmware' Protection"
		cset "name='R DSP1 Firmware' Protection"

		cset "name='DSP1 Preload Switch' 1"
		cset "name='R DSP1 Preload Switch' 1"

		cset "name='PCM Source' DSP"
		cset "name='R PCM Source' DSP"

		cset "name='Analog PCM Volume' 17"
		cset "name='R Analog PCM Volume' 17"

		# The top speaker alone, 22 dB down because it ends up against an ear.
		cset "name='R Digital PCM Volume' 0"
		cset "name='Digital PCM Volume' 641"
	]

	DisableSequence [
		cset "name='Digital PCM Volume' 817"
		cset "name='R Digital PCM Volume' 817"
	]

	# Below Speaker's 100: the loudspeaker stays the route media picks by
	# default, and the sink keeps the name it has today.
	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphones"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CaptureVolume "Mic"
		CaptureSwitch "Mic"
	}
}
