# On-board stereo speakers and the built-in microphones, both behind the
# AOC.  The route to the CS35L41 amplifiers is powered automatically by the
# codec's DAPM, so the devices only need to name their PCMs -- except for the
# speaker-protection DSP, which has to be booted and routed explicitly.

SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "On-board stereo speakers"

	# Route the speakers through the CS35L41's Halo DSP, which runs Cirrus'
	# speaker-protection firmware: it models driver excursion and voice-coil
	# temperature and limits before either exceeds what the driver survives.
	# Out of reset the amplifier takes the ASP straight to the output stage,
	# which plays fine but enforces no such limit, so the speakers can be
	# driven past their mechanical range on loud low-frequency content.
	#
	# The order matters: the sources feed DSP1, the preload switch boots it
	# (loading cirrus/cs35l41-dsp1-spk-prot-<board>[-r].{wmfw,bin}), and only
	# then does the output mux take its input from the DSP rather than the ASP.
	#
	# Values follow the stock mixer_paths.xml: analog gain 17 rather than the
	# 20 the bypass path needed, since the protection tuning supplies the rest
	# of the gain structure and it is what the tuning was voiced against.
	EnableSequence [
		cset "name='DSP RX1 Source' ASPRX1"
		cset "name='DSP RX2 Source' ASPRX1"
		cset "name='R DSP RX1 Source' ASPRX1"
		cset "name='R DSP RX2 Source' ASPRX1"

		cset "name='DSP1 Firmware' Protection"
		cset "name='R DSP1 Firmware' Protection"

		cset "name='DSP1 Preload Switch' 1"
		cset "name='R DSP1 Preload Switch' 1"

		cset "name='PCM Source' DSP"
		cset "name='R PCM Source' DSP"

		cset "name='Analog PCM Volume' 17"
		cset "name='R Analog PCM Volume' 17"
	]

	# Hand the amplifiers back to the unprotected bypass on the way out, so a
	# card left disabled does not sit with a half-configured DSP in its path.
	DisableSequence [
		cset "name='PCM Source' ASP"
		cset "name='R PCM Source' ASP"
		cset "name='DSP1 Preload Switch' 0"
		cset "name='R DSP1 Preload Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphones"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}
