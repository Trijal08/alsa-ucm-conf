# On-board stereo speakers and the built-in microphones, both behind the
# AOC.  The route to the CS35L41 amplifiers is powered automatically by the
# codec's DAPM, so the devices only need to name their PCMs.

SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "On-board stereo speakers"

	# The CS35L41 amplifiers reset to their minimum analog gain (0.5 dB) and
	# have no driver default, so the speakers are silent until this is set.
	# The Cirrus DSP tuning that would otherwise set the gain structure is
	# not loaded, so this analog gain is what makes the speakers usably loud.
	# Applied on every speaker enable (not a BootSequence, which only runs
	# once per fresh card and is skipped once the manager has opened it).
	EnableSequence [
		cset "name='Analog PCM Volume' 20"
		cset "name='R Analog PCM Volume' 20"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphones"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}
