# Use case configuration for the Google Pixel 9 family (caimito board:
# caiman / komodo / tokay -- Pixel 9 Pro, 9 Pro XL and 9).
#
# The audio hardware is identical across the family: an AOC coprocessor
# driving two CS35L41 speaker amplifiers and the built-in microphone array.
# The mainline driver presents all of it as the "aoc-audio" card, so one
# profile serves every model.
Syntax 4

SectionUseCase."HiFi" {
	File "/Google/caimito/HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"

BootSequence [
	# The CS35L41 amplifier (analog) gain resets to its 0.5 dB minimum on
	# every boot, which leaves playback silent; lift both amplifiers to the
	# gain stock uses for media playback.  The digital volume already boots
	# at 0 dB, so it is left alone.
	cset "name='Analog PCM Volume' 17"
	cset "name='R Analog PCM Volume' 17"

	# The microphones boot muted.  The driver already applies these gains by
	# default, but pin them here so they are restored after any control reset.
	cset "name='Mic HW Gain (cB)' 300"
	cset "name='Mic Record Soft Gain (dB)' 22"
]
