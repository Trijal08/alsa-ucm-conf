# Voice call.  The call's audio never crosses the AP -- the modem hands its
# downlink to the AOC and takes its uplink back from it -- so there is no PCM
# here to stream and nothing in this file moves samples.  The route is a
# codec-to-codec link in the driver, which the kernel brings up by itself once
# DAPM has a complete path to the amplifiers: 'Call Downlink Switch' below is
# what completes that path, so setting it is what opens the call.  What is left
# for UCM is that switch and the amplifiers' own setup and levels.
#
# callaudiod selects this verb when a call goes active and HiFi again when it
# ends; it knows only those two names.
#
# There is no telephony PCM at all, so the PCMs named below are the ordinary
# ones, there only so the call daemon has a sink and a source to route to --
# it refuses a card that presents neither.

SectionVerb {
	# Amplifier setup, then the switch that opens the call, in that order,
	# and no levels.  Bringing the call's route up powers the amplifiers,
	# which fires their DAPM widget event and reloads their registers: a
	# level set before that is thrown away, and a route brought up before
	# the sources and the firmware are set comes up on the unprotected
	# bypass.  Levels therefore live in the devices, which UCM applies once
	# the verb is through.
	#
	# The setup is repeated from HiFi rather than shared because a call can
	# be the first thing that ever uses the speakers: with no music played,
	# the protection DSP was never booted and the amplifiers are still on
	# the unprotected bypass at their reset gain.  Every cset is idempotent.
	EnableSequence [
		cset "name='DSP RX1 Source' ASPRX1"
		cset "name='DSP RX2 Source' ASPRX1"
		cset "name='R DSP RX1 Source' ASPRX1"
		cset "name='R DSP RX2 Source' ASPRX1"

		cset "name='DSP1 Firmware' Protection"
		cset "name='R DSP1 Firmware' Protection"

		cset "name='DSP1 Preload Switch' 1"
		cset "name='R DSP1 Preload Switch' 1"

		cset "name='PCM Source' DSP"
		cset "name='R PCM Source' DSP"

		cset "name='Analog PCM Volume' 17"
		cset "name='R Analog PCM Volume' 17"

		# The call itself.  This completes the path from the modem's
		# downlink to the amplifiers, which is what has the driver bind
		# the two and start the modem's flow.
		cset "name='Call Downlink Switch' 1"
	]

	DisableSequence [
		# The call's route goes down first: it is what holds the
		# amplifiers up, and the modem's flow is closed with it.
		cset "name='Call Downlink Switch' 0"

		# Back to unity so a later media stream is not left attenuated.
		cset "name='Digital PCM Volume' 817"
		cset "name='R Digital PCM Volume' 817"
	]

	Value {
		TQ "Voice"
	}
}

# There is no dedicated receiver on this phone, so "earpiece" is the top
# speaker driven quietly.  'Digital PCM Volume' is 0..913 in 0.125 dB steps
# with 817 = 0 dB (unity, the boot default); 641 is 22 dB down, which is the
# backoff the equivalent tuning uses on tegu.  Lower is safe, higher is not --
# this ends up against an actual ear.
SectionDevice."Earpiece" {
	Comment "Earpiece (top speaker, near-field)"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='R Digital PCM Volume' 0"
		cset "name='Digital PCM Volume' 641"
	]

	DisableSequence [
		cset "name='Digital PCM Volume' 817"
		cset "name='R Digital PCM Volume' 817"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Speaker" {
	Comment "On-board stereo speakers"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='Digital PCM Volume' 817"
		cset "name='R Digital PCM Volume' 817"
	]

	DisableSequence [
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphones"

	# Name the soft gain as this device's capture volume.  The uplink never
	# crosses the AP -- the AOC takes it straight from the microphones and hands
	# it to the modem -- so a mute applied in PipeWire lands on a source that
	# carries no call audio and does nothing at all: verified, muting and
	# unmuting the source moves neither gain control.  Naming the control here
	# gives PipeWire a hardware volume to drive instead, so the dialler's mute
	# reaches the microphone.  Zero on this control is true silence rather than
	# 0 dB, which is what makes it usable as a mute on a card that has no mute
	# switch -- these two gains are the only microphone controls it has.
	#
	# The HW gain is deliberately left alone: one control is enough to silence
	# the path, and PipeWire would otherwise own both.
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CaptureVolume "Mic"
		CaptureSwitch "Mic"
	}
}
