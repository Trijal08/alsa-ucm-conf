# Voice call.  The call's audio never crosses the AP -- the modem hands its
# downlink to the AOC and takes its uplink back from it -- so there is no PCM
# to stream and nothing here moves samples.  What the verb does is tell the
# kernel to open the path, which binds the AOC's modem downlink to the speaker
# and powers the amplifiers that a stream would otherwise have powered.
#
# callaudiod selects this verb when a call goes active, and HiFi again when it
# ends.  It knows only those two names, so without this file it reports "card
# has no voice profile" and routes nothing.

SectionVerb {
	# Everything is in the verb's own sequence rather than a device's: a call
	# has no stream, so nothing guarantees a device is ever enabled, and the
	# verb is the one part callaudiod always applies.
	#
	# The amplifier setup is the same as HiFi's and is repeated rather than
	# shared, because a call can be the first thing that ever uses the
	# speakers: if no music has played, the protection DSP was never booted
	# and the amplifiers are still on the unprotected bypass at their reset
	# gain.  Every cset here is idempotent, so applying it again costs
	# nothing when HiFi has already run.
	EnableSequence [
		cset "name='DSP RX1 Source' ASPRX1"
		cset "name='DSP RX2 Source' ASPRX1"
		cset "name='R DSP RX1 Source' ASPRX1"
		cset "name='R DSP RX2 Source' ASPRX1"

		cset "name='DSP1 Firmware' Protection"
		cset "name='R DSP1 Firmware' Protection"

		cset "name='DSP1 Preload Switch' 1"
		cset "name='R DSP1 Preload Switch' 1"

		cset "name='PCM Source' DSP"
		cset "name='R PCM Source' DSP"

		cset "name='Analog PCM Volume' 17"
		cset "name='R Analog PCM Volume' 17"

		# Last: the kernel configures the amplifiers for the wire, opens the
		# path so the AOC starts clocking it, and only then powers them.
		cset "name='Voice Call Switch' 1"
	]

	DisableSequence [
		cset "name='Voice Call Switch' 0"
	]

	Value {
		TQ "Voice"
	}
}

# The devices exist so the call daemon has a sink and a source to route to --
# it refuses a card that presents neither.  Their PCMs are the ordinary ones:
# opening them during a call is not how call audio flows, but having them named
# costs nothing and lets in-call media (a tone, a recording) use the same route.
SectionDevice."Speaker" {
	Comment "Call audio through the on-board speakers"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Call audio from the built-in microphones"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}
