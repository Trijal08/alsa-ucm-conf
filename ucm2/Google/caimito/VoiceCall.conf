# Voice call.  The call's audio never crosses the AP -- the modem hands its
# downlink to the AOC and takes its uplink back from it -- so there is no PCM
# here to stream and nothing in this file moves samples.  The route itself is
# the driver's: opening the AOC telephony front end (hw:N,2) binds the modem's
# downlink to the speaker sink and powers the amplifiers.  What is left for UCM
# is the amplifiers' own setup and levels.
#
# callaudiod selects this verb when a call goes active and HiFi again when it
# ends; it knows only those two names.
#
# Deliberately nothing here names the telephony PCM.  It has no data path, and
# declaring it would have PipeWire's ACP probe-open and then stream to it,
# which fails and gets the whole profile discarded.  The PCMs named below are
# the ordinary ones, so the call daemon has a sink and a source to route to --
# it refuses a card that presents neither.

SectionVerb {
	# Amplifier setup only -- no levels.  Opening the telephony front end
	# powers the TDM0 back end, which fires the amplifiers' DAPM widget
	# event and reloads their registers; a level set before that is thrown
	# away.  Levels therefore live in the devices, which are applied after
	# the front end is open.
	#
	# Repeated from HiFi rather than shared because a call can be the first
	# thing that ever uses the speakers: with no music played, the
	# protection DSP was never booted and the amplifiers are still on the
	# unprotected bypass at their reset gain.  Every cset is idempotent.
	EnableSequence [
		cset "name='DSP RX1 Source' ASPRX1"
		cset "name='DSP RX2 Source' ASPRX1"
		cset "name='R DSP RX1 Source' ASPRX1"
		cset "name='R DSP RX2 Source' ASPRX1"

		cset "name='DSP1 Firmware' Protection"
		cset "name='R DSP1 Firmware' Protection"

		cset "name='DSP1 Preload Switch' 1"
		cset "name='R DSP1 Preload Switch' 1"

		cset "name='PCM Source' DSP"
		cset "name='R PCM Source' DSP"

		cset "name='Analog PCM Volume' 17"
		cset "name='R Analog PCM Volume' 17"
	]

	DisableSequence [
		# Back to unity so a later media stream is not left attenuated.
		cset "name='Digital PCM Volume' 817"
		cset "name='R Digital PCM Volume' 817"
	]

	Value {
		TQ "Voice"
	}
}

# There is no dedicated receiver on this phone, so "earpiece" is the top
# speaker driven quietly.  'Digital PCM Volume' is 0..913 in 0.125 dB steps
# with 817 = 0 dB (unity, the boot default); 641 is 22 dB down, which is the
# backoff the equivalent tuning uses on tegu.  Lower is safe, higher is not --
# this ends up against an actual ear.
SectionDevice."Earpiece" {
	Comment "Earpiece (top speaker, near-field)"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='R Digital PCM Volume' 0"
		cset "name='Digital PCM Volume' 641"
	]

	DisableSequence [
		cset "name='Digital PCM Volume' 817"
		cset "name='R Digital PCM Volume' 817"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Speaker" {
	Comment "Speakerphone (both speakers)"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='Digital PCM Volume' 817"
		cset "name='R Digital PCM Volume' 817"
	]

	DisableSequence [
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Call audio from the built-in microphones"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}
